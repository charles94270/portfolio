<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message envoyé — Charles Brioix</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#201D19;color:#FBF7F1;font-family:'General Sans',Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:32px}
.box{max-width:560px;display:flex;flex-direction:column;gap:24px}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#D68A55;display:flex;align-items:center;gap:12px;margin:0}
.kicker i{width:32px;height:1px;background:#D68A55;display:block}
h1{font-size:clamp(34px,6vw,52px);font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:0}
p{font-size:18px;line-height:1.65;color:#B5AC9F;margin:0;text-wrap:pretty}
a.btn{align-self:flex-start;background:#3C6CA8;color:#fff;text-decoration:none;padding:17px 28px;border-radius:3px;font-size:14.5px;font-weight:500;transition:background-color .25s ease,transform .25s ease}
a.btn:hover{background:#4E80BE;transform:translateY(-2px)}
a.back{color:#B5AC9F;font-size:14px}
a.back:hover{color:#FBF7F1}
</style>
</head>
<body>
<div class="box">
  <p class="kicker"><i></i>Message reçu</p>
  <h1>Merci, votre message est parti.</h1>
  <p>Je réponds sous 24 à 48 heures ouvrées. Si votre sujet est urgent, réservez directement un créneau de 30 minutes dans mon agenda.</p>
  <a class="btn" href="https://calendar.notion.so/meet/charles_brioix/8yjfd4ze1" target="_blank" rel="noopener">Réserver un créneau de 30 min</a>
  <a class="back" href="/">← Retour à l'accueil</a>
</div>
</body>
</html>
